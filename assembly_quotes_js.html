<script>
// ============================================================
// assembly_quotes_js.html — 価格表「🛠 組立費 構成一覧」（52_assembly_quotes.gs）
//   ① 構成別：どの構成の組立費見積が、いつ・いくらで提出済みか
//   ② 機種別予定：進捗管理システムの機種（使用基板・日程）ごとに 見積済み／要見積 と 提出期限
// ============================================================
var AQ = { data: null, tab: 'plan', q: '', onlyNeed: false };

(function hookAssemblyPage() {
  if (typeof initPriceListPage !== 'function') return;
  var prevInit = initPriceListPage;
  initPriceListPage = function () {
    prevInit.apply(this, arguments);
    var auto = document.getElementById('pl-tab-auto');
    if (!auto || document.getElementById('pl-tab-aq')) return;
    var b = document.createElement('button');
    b.className = 'btn btn-sm btn-outline'; b.id = 'pl-tab-aq'; b.textContent = '🛠 組立費 構成一覧';
    b.onclick = function () { _plSwitchPageTab('aq'); };
    auto.before(b);
    var panel = document.createElement('div'); panel.id = 'pl-panel-aq'; panel.style.display = 'none';
    panel.innerHTML = '<div id="aq-box"><div class="loading"><div class="spinner"></div><br>読み込み中...</div></div>';
    document.getElementById('pl-panel-auto').before(panel);
  };
  var prevSwitch = _plSwitchPageTab;
  _plSwitchPageTab = function (tab) {
    var panel = document.getElementById('pl-panel-aq'), btn = document.getElementById('pl-tab-aq');
    if (tab === 'aq') {
      document.querySelectorAll('[id^="pl-panel-"]').forEach(function (p) { p.style.display = 'none'; });
      document.querySelectorAll('[id^="pl-tab-"]').forEach(function (bt) { bt.className = 'btn btn-sm btn-outline'; });
      if (panel) panel.style.display = '';
      if (btn) btn.className = 'btn btn-sm btn-primary';
      _plPageTab = 'aq';
      if (AQ.data) aqRender(); else aqLoad();
      return;
    }
    if (panel) panel.style.display = 'none';
    if (btn) btn.className = 'btn btn-sm btn-outline';
    return prevSwitch.apply(this, arguments);
  };
})();

function aqLoad(cfg) {
  var box = document.getElementById('aq-box'); if (box) box.innerHTML = '<div class="loading"><div class="spinner"></div><br>組立費の見積と進捗管理の予定を集計しています...</div>';
  google.script.run.withSuccessHandler(function (res) {
    if (!res || !res.success) { if (box) box.innerHTML = '<div style="color:var(--danger);padding:16px;">⚠ ' + _esc((res && res.error) || '読み込めませんでした') + '</div>'; return; }
    AQ.data = res; aqRender();
  }).withFailureHandler(function (e) { if (box) box.innerHTML = '<div style="color:var(--danger);padding:16px;">⚠ ' + _esc(e.message || String(e)) + '</div>'; })
    .handleApiRequest(cfg ? 'assemblyQuotesCfg' : 'assemblyQuotes', cfg || {});
}

var _aqTh = function (t, ex) { return '<th style="border:1px solid #94a3b8;padding:5px 8px;background:#e2e8f0;text-align:left;white-space:nowrap;' + (ex || '') + '">' + t + '</th>'; };
var _aqTd = function (t, ex) { return '<td style="border:1px solid #cbd5e1;padding:5px 8px;vertical-align:top;' + (ex || '') + '">' + t + '</td>'; };
var _aqYen = function (n) { return n ? '¥' + Number(n).toLocaleString('ja-JP', { maximumFractionDigits: 2 }) : '—'; };
var _aqPdf = function (u) { return u ? '<a href="' + _esc(u) + '" target="_blank">📄</a>' : ''; };

function aqRender() {
  var box = document.getElementById('aq-box'); if (!box || !AQ.data) return;
  var d = AQ.data;
  var need = d.plans.filter(function (p) { return p.status === '要見積'; });
  var mismatch = d.plans.filter(function (p) { return p.status === '区分違い'; });
  var skip = d.plans.filter(function (p) { return p.status === '見積不要'; });
  var soon = need.concat(mismatch).filter(function (p) { return p.leftDays != null && p.leftDays <= 30; });
  var tab = function (k, label) { return '<button class="btn btn-sm ' + (AQ.tab === k ? 'btn-primary' : 'btn-outline') + '" onclick="AQ.tab=\'' + k + '\';aqRender()">' + label + '</button>'; };
  var html = '<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px;">'
    + tab('plan', '📅 機種別の予定 ' + d.plans.length + (need.length ? '（<b style="color:#dc2626;">要見積 ' + need.length + '</b>' : '')
        + (mismatch.length ? (need.length ? '／' : '（') + '<b style="color:#c2410c;">区分違い ' + mismatch.length + '</b>' : '') + (need.length || mismatch.length ? '）' : ''))
    + tab('comp', '🛠 構成別の見積 ' + d.comps.length) + tab('cfg', '⚙ 設定')
    + '<input type="text" placeholder="機種・基板・見積Noで検索" value="' + _esc(AQ.q) + '" oninput="AQ.q=this.value;aqRenderBody()" style="flex:1;min-width:180px;padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:12px;">'
    + '<button class="btn btn-outline btn-sm" onclick="aqCsv()" style="color:#16a34a;border-color:#16a34a;">📥 CSV</button>'
    + '<button class="btn btn-outline btn-sm" onclick="aqLoad()">↻ 再集計</button></div>'
    + '<div style="font-size:12px;color:var(--text-sub);margin-bottom:6px;">組立費の見積（カテゴリ「組立費」または件名に（完）・組立）を、種類＋使用基板＋区分ごとにまとめています（種類・区分は ⚙ 設定 で追加できます）。解体費・リユース組立費・検査費（AG6R エコ／リユース等）は構成ごとに入力できます。'
    + '機種別の予定は 進捗管理システムの機種DB（使用基板 M・D・DE・E・C と日程）と突き合わせ、提出期限＝組立予定（量産組立→見本機組立→部品集約時期の早い方）−' + d.cfg.leadDays + '日 です。'
    + '見積の要否は〈基板世代（AG5／AG6R）×新品か中古再生か〉で決まる商流で判定します：AG6Rの中古再生＝サン電子商流で<b>要見積</b>、AG5の中古再生＝イードリーム商流で<b>見積不要</b>（世代・商流のルールは ⚙ 設定 で変更できます）。'
    + (soon.length ? '<b style="color:#dc2626;"> 30日以内に提出期限が来る要見積・区分違い ' + soon.length + '件</b>' : '')
    + (skip.length ? '<span style="color:#64748b;"> イードリーム商流で見積不要 ' + skip.length + '件</span>' : '')
    + '　集計: ' + _esc(d.generatedAt) + '（シート「組立費_構成別見積」「組立費_機種別予定」にも出力）</div>'
    + (d.planError ? '<div style="color:#b45309;background:#fffbeb;border:1px solid #fde68a;padding:6px 10px;border-radius:6px;margin-bottom:6px;">⚠ ' + _esc(d.planError) + '</div>' : '')
    + '<div id="aq-body"></div>';
  box.innerHTML = html;
  aqRenderBody();
}

function _aqHit(s) { var q = String(AQ.q || '').toLowerCase().trim(); return !q || q.split(/\s+/).every(function (k) { return s.toLowerCase().indexOf(k) >= 0; }); }

function aqRenderBody() {
  var el = document.getElementById('aq-body'); if (!el || !AQ.data) return;
  var d = AQ.data;
  if (AQ.tab === 'cfg') {
    el.innerHTML = '<table style="border-collapse:collapse;font-size:13px;max-width:760px;width:100%;">'
      + '<tr>' + _aqTh('提出期限の準備日数') + _aqTd('組立予定の <input type="number" id="aq-lead" min="0" max="365" value="' + d.cfg.leadDays + '" style="width:70px;"> 日前を提出期限にする') + '</tr>'
      + '<tr>' + _aqTh('進捗管理のスプレッドシート') + _aqTd('<input type="text" id="aq-ss" value="' + _esc(d.cfg.progressSsId) + '" style="width:100%;"><div style="font-size:11px;color:#64748b;">進捗管理システムが毎朝7時に書き出す「DB_機種」「DB_登録機種」シートのあるスプレッドシート（IDまたはURL）</div>') + '</tr></table>'
      + aqListEditor('種類（組立の対象）', 'aq-types', d.cfg.types, true)
      + aqListEditor('区分（新品・中古・リユース等）', 'aq-vars', d.cfg.variants, false)
      + aqGenEditor(d.cfg.gens)
      + '<h4 style="margin:14px 0 4px;">中古再生とみなす言葉</h4>'
      + '<div style="font-size:11px;color:#64748b;margin-bottom:4px;">件名・区分・機種名にこの言葉があれば「中古再生」として扱い、無ければ「新品」として扱います。「再販」と区別するため『再生』は2文字で入れてください。</div>'
      + '<input type="text" id="aq-reusekw" value="' + _esc((d.cfg.reuseKeywords || []).join('、')) + '" placeholder="中古、再生、リユース、エコ" style="width:100%;padding:4px 8px;">'
      + '<div style="margin-top:8px;display:flex;gap:8px;"><button class="btn btn-primary btn-sm" onclick="aqCfgSave()">💾 保存して再集計</button>'
      + '<button class="btn btn-outline btn-sm" onclick="if(confirm(\'種類・区分を初期設定に戻します\'))aqLoad({resetLists:true})">初期設定に戻す</button></div>';
    return;
  }
  if (AQ.tab === 'comp') {
    var rows = d.comps.filter(function (c) { return _aqHit([c.type, c.boards.join(' '), c.variant, c.gen || '', c.channel || ''].concat(c.quotes.map(function (q) { return q.quoteNo + ' ' + q.subject; })).join(' ')); });
    var used = {};
    d.plans.forEach(function (p) { p.quotes.forEach(function (q) { (used[q.quoteNo] = used[q.quoteNo] || []).push(p.machine); }); });
    var lastType = '';
    el.innerHTML = '<div class="bpt-wrap" style="overflow:auto;"><table style="border-collapse:collapse;font-size:12px;width:100%;"><tr>'
      + ['種類', '使用基板', '区分', '世代', '新品/中古', '商流', '最新見積No', '提出日', '金額', '解体費', 'リユース組立費', '検査費', 'PDF', '件数', '件名', '採用予定の機種'].map(function (t) { return _aqTh(t); }).join('') + '</tr>'
      + rows.map(function (c) {
          var ci = d.comps.indexOf(c);
          var l = c.latest || {};
          var sec = c.type !== lastType ? '<tr><td colspan="16" style="background:#f1f5f9;font-weight:700;border:1px solid #cbd5e1;padding:4px 8px;">' + _esc(c.type) + '</td></tr>' : '';
          lastType = c.type;
          var hist = c.quotes.slice(1).map(function (q) { return _esc(q.quoteNo) + ' ' + _aqYen(q.amount) + ' ' + _esc(q.date) + (q.archived ? '（' + _esc(q.status) + '）' : ''); }).join('<br>');
          return sec + '<tr>' + _aqTd('') + _aqTd('<b>' + _esc(c.boards.join(' / ') || '（件名に基板なし）') + '</b>')
            + _aqTd(_esc(c.variant))
            + _aqTd(c.gen ? '<b>' + _esc(c.gen) + '</b>' : '<span style="color:#94a3b8;">—</span>', 'white-space:nowrap;')
            + _aqTd(_esc(c.kind || ''), 'white-space:nowrap;' + (c.kind === '中古再生' ? 'background:#fef3c7;' : ''))
            + _aqTd(_esc(c.channel || ''), 'white-space:nowrap;' + (c.needQuote === '不要' ? 'background:#f1f5f9;color:#64748b;' : ''))
            + _aqTd('<b>' + _esc(l.quoteNo || '') + '</b>', 'white-space:nowrap;') + _aqTd(_esc(l.date || ''), 'white-space:nowrap;')
            + _aqTd(_aqYen(l.amount), 'text-align:right;white-space:nowrap;background:#fef9c3;font-weight:700;')
            + ['dismantle', 'reuseAssy', 'inspect'].map(function (f) { var v = (c.extra || {})[f]; return _aqTd('<input type="text" inputmode="decimal" value="' + (v == null ? '' : v) + '" placeholder="—" onchange="aqExtraSave(' + ci + ',\'' + f + '\',this.value)" style="width:80px;text-align:right;padding:2px 4px;border:1px solid #e2e8f0;border-radius:4px;">'); }).join('')
            + _aqTd(_aqPdf(l.pdfUrl))
            + _aqTd(c.count + (hist ? '<details><summary style="cursor:pointer;font-size:11px;">過去</summary><div style="font-size:11px;">' + hist + '</div></details>' : ''))
            + _aqTd(_esc(l.subject || ''), 'max-width:280px;') + _aqTd(_esc((used[l.quoteNo] || []).join('、'))) + '</tr>';
        }).join('') + '</table></div>';
    return;
  }
  var _aqTodo = ['要見積', '区分違い', '一部一致'];
  var plans = d.plans.filter(function (p) { return (!AQ.onlyNeed || _aqTodo.indexOf(p.status) >= 0) && _aqHit([p.machine, p.title, p.type, p.boards, p.gen || '', p.kind || '', p.channel || ''].concat(p.quotes.map(function (q) { return q.quoteNo; })).join(' ')); });
  el.innerHTML = '<label style="font-size:12px;display:inline-flex;gap:4px;align-items:center;margin-bottom:6px;"><input type="checkbox"' + (AQ.onlyNeed ? ' checked' : '') + ' onchange="AQ.onlyNeed=this.checked;aqRenderBody()"> 要見積・区分違い・一部一致だけ表示（見積不要・見積済みを隠す）</label>'
    + '<div class="bpt-wrap" style="overflow:auto;"><table style="border-collapse:collapse;font-size:12px;width:100%;"><tr>'
    + ['機種', 'タイトル', '販売時期', '種類', '使用基板', '世代 / 必要区分', '商流', '見積状況', '提出済みの見積（区分 / 見積No / 金額 / 提出日）', '基準の日程', '提出期限', '残り', '進捗'].map(function (t) { return _aqTh(t); }).join('') + '</tr>'
    + plans.map(function (p) {
        var stc = p.status === '見積済み' ? 'background:#dcfce7;color:#166534;'
          : p.status === '見積不要' ? 'background:#f1f5f9;color:#64748b;'
          : p.status === '一部一致' ? 'background:#fef3c7;color:#92400e;'
          : p.status === '区分違い' ? 'background:#ffedd5;color:#9a3412;font-weight:700;'
          : 'background:#fee2e2;color:#b91c1c;font-weight:700;';
        var stTip = p.status === '区分違い' ? '同じ構成の見積はありますが、必要な区分（' + _esc(p.kind || '') + '）の見積がありません。新品と中古再生は単価が違うため流用できません。'
          : p.status === '見積不要' ? _esc(p.channel || '') + '商流のため弊社の見積書は不要です。' : '';
        var left = p.leftDays == null ? '' : p.leftDays < 0 ? '<b style="color:#dc2626;">' + (-p.leftDays) + '日超過</b>' : 'あと' + p.leftDays + '日';
        var q = p.quotes.map(function (x) {
          return (x.fit === false ? '<span style="color:#9a3412;" title="必要な区分・世代と違う見積です">△ </span>' : '')
            + _esc(x.variant) + (x.gen ? '（' + _esc(x.gen) + '）' : '') + ' / <b>' + _esc(x.quoteNo) + '</b> / ' + _aqYen(x.amount) + ' / ' + _esc(x.date) + ' ' + _aqPdf(x.pdfUrl)
            + (p.status === '一部一致' ? '<br><small style="color:#92400e;">（' + _esc(x.boards) + '）</small>' : '');
        }).join('<br>');
        var warn = (p.status === '要見積' || p.status === '区分違い') && p.leftDays != null && p.leftDays <= 30;
        return '<tr' + (warn ? ' style="background:#fff7ed;"' : '') + '>' + _aqTd('<b>' + _esc(p.machine) + '</b><br><small>' + _esc(p.customer) + '</small>', 'white-space:nowrap;') + _aqTd(_esc(p.title))
          + _aqTd(_esc(p.sales), 'white-space:nowrap;') + _aqTd(_esc(p.type), 'white-space:nowrap;') + _aqTd(_esc(p.boards))
          + _aqTd((p.gen ? '<b>' + _esc(p.gen) + '</b>' + (p.genGuess ? '<small style="color:#c2410c;" title="構成表・機種名に世代の表記が無いため、基板が完全一致する見積の世代から推定しました">（推定）</small>' : '') : '<span style="color:#94a3b8;">世代不明</span>') + '<br><small>' + _esc(p.kind || '') + '</small>',
                  'white-space:nowrap;' + (p.kind === '中古再生' ? 'background:#fef3c7;' : ''))
          + _aqTd(_esc(p.channel || ''), 'white-space:nowrap;' + (p.needQuote === '不要' ? 'color:#64748b;' : ''))
          + _aqTd('<span' + (stTip ? ' title="' + stTip + '"' : '') + '>' + _esc(p.status) + '</span>', stc + 'white-space:nowrap;') + _aqTd(q || '<span style="color:#94a3b8;">—</span>')
          + _aqTd(p.baseDate ? _esc(p.baseLabel) + '<br>' + _esc(p.baseDate) : '<span style="color:#94a3b8;">日程未登録</span>', 'white-space:nowrap;')
          + _aqTd(_esc(p.deadline || ''), 'white-space:nowrap;' + (warn ? 'background:#fef08a;font-weight:700;' : '')) + _aqTd(left, 'white-space:nowrap;') + _aqTd(_esc(p.progressStatus)) + '</tr>';
      }).join('') + '</table></div>';
}

// ── 設定：種類・区分の一覧（追加・削除・並べ替え。上から順にキーワードで判定）──
function aqListEditor(title, id, list, withBoards) {
  var rows = (list || []).map(function (t, i) { return aqListRow(id, t, withBoards); }).join('');
  return '<h4 style="margin:14px 0 4px;">' + title + '</h4>'
    + '<div style="font-size:11px;color:#64748b;margin-bottom:4px;">件名にキーワードのどれかを含む見積をその' + (withBoards ? '種類' : '区分') + 'にします（上から順に判定）。'
    + (withBoards ? '「基板の頭文字」は件名に種類の言葉が無い時と、進捗管理の機種の使用基板（M・D・DE・E・C）から必要な組立を決める時に使います。' : 'キーワードが空の区分は、どれにも当たらない時の区分（新品など）です。') + '</div>'
    + '<table style="border-collapse:collapse;font-size:12px;width:100%;"><tbody id="' + id + '">' + rows + '</tbody></table>'
    + '<button class="btn btn-outline btn-sm" style="margin-top:4px;" onclick="document.getElementById(\'' + id + '\').insertAdjacentHTML(\'beforeend\', aqListRow(\'' + id + '\', {name:\'\',keywords:[],boards:[]}, ' + withBoards + '))">＋ 追加</button>';
}
function aqListRow(id, t, withBoards) {
  var inp = function (cls, v, ph, w) { return '<input class="' + cls + '" value="' + _esc(v) + '" placeholder="' + ph + '" style="width:' + w + ';padding:3px 6px;">'; };
  return '<tr>' + _aqTd(inp('aq-n', t.name || '', '名前（例: メダル数制御基板（スロット））', '100%'), 'width:30%;')
    + _aqTd(inp('aq-k', (t.keywords || []).join('、'), 'キーワード（、区切り）', '100%'))
    + (withBoards ? _aqTd(inp('aq-b', (t.boards || []).join('、'), '基板の頭文字 例: M', '110px'), 'width:130px;') : '')
    + _aqTd('<button class="btn btn-outline btn-sm" title="上へ" onclick="var r=this.closest(\'tr\');if(r.previousElementSibling)r.parentNode.insertBefore(r,r.previousElementSibling)">↑</button> '
      + '<button class="btn btn-outline btn-sm" title="削除" onclick="this.closest(\'tr\').remove()">✕</button>', 'white-space:nowrap;width:80px;') + '</tr>';
}
function _aqReadList(id, withBoards) {
  return Array.prototype.map.call(document.querySelectorAll('#' + id + ' tr'), function (tr) {
    var o = { name: tr.querySelector('.aq-n').value.trim(), keywords: tr.querySelector('.aq-k').value };
    if (withBoards) o.boards = tr.querySelector('.aq-b').value;
    return o;
  }).filter(function (o) { return o.name; });
}
function aqCfgSave() {
  aqLoad({ leadDays: Number(document.getElementById('aq-lead').value), progressSsId: document.getElementById('aq-ss').value,
           types: _aqReadList('aq-types', true), variants: _aqReadList('aq-vars', false),
           gens: _aqReadGens(), reuseKeywords: document.getElementById('aq-reusekw').value });
}

// ── 設定：基板世代と商流（中古再生のときの見積要否）──
function aqGenEditor(list) {
  var rows = (list || []).map(function (g) { return aqGenRow(g); }).join('');
  return '<h4 style="margin:14px 0 4px;">基板世代と商流（見積の要否）</h4>'
    + '<div style="font-size:11px;color:#64748b;margin-bottom:4px;">件名・基板名・機種コード・進捗管理の使用基板セルにキーワードがあれば、その世代として扱います（上から順に判定）。'
    + '商流と要否は<b>中古再生のときだけ</b>適用され、新品・見本機・アフター用は常にサン電子商流（要見積）です。'
    + '「構成表の表記で中古再生」にチェックを入れると、進捗管理の使用基板セルにこの世代名が入っているだけで中古再生とみなします（例：D列が「AG6R」＝新品の D／SNB 基板ではなく AG6R ユニットの再生を使う）。'
    + '世代が取れない中古再生は、取りこぼしを防ぐため「要見積」のまま残します。</div>'
    + '<table style="border-collapse:collapse;font-size:12px;width:100%;"><tr>'
    + ['世代', 'キーワード（、区切り）', '商流', '中古再生の見積', '構成表の表記で中古再生', ''].map(function (t) { return _aqTh(t); }).join('') + '</tr>'
    + '<tbody id="aq-gens">' + rows + '</tbody></table>'
    + '<button class="btn btn-outline btn-sm" style="margin-top:4px;" onclick="document.getElementById(\'aq-gens\').insertAdjacentHTML(\'beforeend\', aqGenRow({name:\'\',keywords:[],channel:\'サン電子\',needQuote:\'要\',planReuse:false}))">＋ 追加</button>';
}
function aqGenRow(g) {
  var inp = function (cls, v, ph, w) { return '<input class="' + cls + '" value="' + _esc(v) + '" placeholder="' + ph + '" style="width:' + w + ';padding:3px 6px;">'; };
  var sel = String(g.needQuote || '要').indexOf('不要') >= 0 ? '不要' : '要';
  return '<tr>' + _aqTd(inp('aq-gn', g.name || '', '例: AG6R', '90px'), 'width:110px;')
    + _aqTd(inp('aq-gk', (g.keywords || []).join('、'), '例: AG6R', '100%'))
    + _aqTd(inp('aq-gc', g.channel || 'サン電子', '例: サン電子', '120px'), 'width:140px;')
    + _aqTd('<select class="aq-gq" style="padding:3px 6px;"><option' + (sel === '要' ? ' selected' : '') + '>要</option><option' + (sel === '不要' ? ' selected' : '') + '>不要</option></select>', 'width:90px;')
    + _aqTd('<input type="checkbox" class="aq-gr"' + (g.planReuse ? ' checked' : '') + '>', 'text-align:center;width:150px;')
    + _aqTd('<button class="btn btn-outline btn-sm" title="上へ" onclick="var r=this.closest(\'tr\');if(r.previousElementSibling)r.parentNode.insertBefore(r,r.previousElementSibling)">↑</button> '
      + '<button class="btn btn-outline btn-sm" title="削除" onclick="this.closest(\'tr\').remove()">✕</button>', 'white-space:nowrap;width:80px;') + '</tr>';
}
function _aqReadGens() {
  return Array.prototype.map.call(document.querySelectorAll('#aq-gens tr'), function (tr) {
    return { name: tr.querySelector('.aq-gn').value.trim(), keywords: tr.querySelector('.aq-gk').value,
             channel: tr.querySelector('.aq-gc').value.trim(), needQuote: tr.querySelector('.aq-gq').value,
             planReuse: tr.querySelector('.aq-gr').checked };
  }).filter(function (o) { return o.name; });
}

// ── 追加費用（解体費・リユース組立費・検査費）の保存 ──
function aqExtraSave(ci, field, value) {
  var c = AQ.data && AQ.data.comps[ci]; if (!c) return;
  c.extra = c.extra || {};
  c.extra[field] = value === '' ? null : value;
  var x = c.extra;
  google.script.run.withSuccessHandler(function (r) {
    if (!r || !r.success) { showToast((r && r.error) || '保存できませんでした', true); return; }
    showToast('保存しました');
  }).withFailureHandler(function (e) { showToast(e.message || String(e), true); })
    .handleApiRequest('assemblyExtraSave', { key: c.key, type: c.type, boards: c.boards.join(' / '), variant: c.variant,
      dismantle: x.dismantle == null ? '' : x.dismantle, reuseAssy: x.reuseAssy == null ? '' : x.reuseAssy, inspect: x.inspect == null ? '' : x.inspect, memo: x.memo || '' });
}

function aqCsv() {
  var d = AQ.data; if (!d) return;
  if (AQ.tab === 'comp') {
    _downloadCsv('組立費_構成別見積_' + _today() + '.csv', ['種類', '使用基板', '区分', '世代', '新品/中古', '商流', '最新見積No', '提出日', '金額', '解体費', 'リユース組立費', '検査費', '件数', '件名'],
      d.comps.map(function (c) { var l = c.latest || {}, x = c.extra || {}; return [c.type, c.boards.join(' / '), c.variant, c.gen || '', c.kind || '', c.channel || '', l.quoteNo || '', l.date || '', l.amount || '', x.dismantle == null ? '' : x.dismantle, x.reuseAssy == null ? '' : x.reuseAssy, x.inspect == null ? '' : x.inspect, c.count, l.subject || '']; }));
  } else {
    _downloadCsv('組立費_機種別予定_' + _today() + '.csv', ['機種', '得意先', 'タイトル', '販売時期', '種類', '使用基板', '世代', '必要区分', '商流', '見積要否', '見積状況', '見積', '基準日程', '基準日', '提出期限', '残り日数', '進捗'],
      d.plans.map(function (p) { return [p.machine, p.customer, p.title, p.sales, p.type, p.boards, (p.gen || '') + (p.genGuess ? '（推定）' : ''), p.kind || '', p.channel || '', p.needQuote || '', p.status, p.quotes.map(function (q) { return (q.fit === false ? '△' : '') + q.variant + ':' + q.quoteNo + ' ' + q.amount + ' ' + q.date; }).join(' / '), p.baseLabel, p.baseDate, p.deadline, p.leftDays == null ? '' : p.leftDays, p.progressStatus]; }));
  }
}
