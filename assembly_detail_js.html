      return '<tr><td style="' + td + 'background:#cbd5e1;width:18px;"></td><td style="' + td + '">' + inp('name', '') + '</td><td style="' + td + 'width:120px;">' + inp('price', 'text-align:right;' + (sec === '値引き' ? 'color:#dc2626;' : '')) + '</td><td style="' + td + '">' + inp('note', '') + '</td><td style="' + td + 'width:30px;"><button class="btn btn-outline btn-sm" style="padding:0 6px;" onclick="AQD.lines.splice(' + i + ',1);aqdRender()">✕</button></td></tr>';

var AQ_HW_LABELS = { '主制御基板': 'M', '液晶制御基板': 'D', 'VDP': 'vdp', '演出IF基板': 'E', '演出基板': 'E', '液晶IF基板': 'DE', '枠制御基板': 'C', 'メダル数制御基板': 'C' };

}
function aqHwPage(tc, vp, kind) {

    var o = { machine: code, frame: frame, kind: kind, title: rest.slice(0, 2).filter(function (s, i) { return i === 0 || s.length > 3; }).join('') };
    Object.keys(C.cell).forEach(function (f) {
      var v = byRow(C.cell[f], 2).map(function (l) { return l.s; }).join(' ');
      v = v.replace(/構成確定/g, '').replace(/([ァ-ヶー一-龥]) (?=[ァ-ヶー一-龥])/g, '$1').trim();
      if (v && v !== '-' && v !== 'ー') o[f] = v;
    });
    if (!o.M && !o.D) return;

}
