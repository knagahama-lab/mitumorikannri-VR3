<script>
// ============================================================
// assembly_detail_js.html — 組立費 構成一覧の編集（55_assembly_detail.gs）
//   構成別の見積（その場で編集）／見積内訳／区分別の価格／枠構成（ハードウェア構成一覧表）
// ============================================================
var AQ_FR_COLS = [['machine', '機種'], ['title', 'タイトル'], ['kind', '種別'], ['frame', '枠構成'], ['M', '主制御基板'], ['D', '液晶制御基板'], ['vdp', 'VDP'],
                  ['DE', '液晶IF基板'], ['E', '演出IF基板'], ['C', '枠制御・メダル数制御'], ['memo', '備考'], ['version', '版']];

function _adApi(action, payload, ok, ng) {
  google.script.run.withSuccessHandler(function (r) {
    if (!r || !r.success) { showToast((r && r.error) || '保存できませんでした', true); if (ng) ng(); return; }
    if (ok) ok(r);
  }).withFailureHandler(function (e) { showToast(e.message || String(e), true); if (ng) ng(); }).handleApiRequest(action, payload || {});
}
var _adFmt = function (n) { return n === null || n === undefined || n === '' ? '' : Number(n).toLocaleString('ja-JP', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
function _adParse(v) {
  var s = String(v === null || v === undefined ? '' : v).normalize('NFKC').replace(/[,¥円%\s]/g, '').replace(/[−‐―ー]/g, '-');
  return s === '' ? null : Number(s);
}
function _adFrameList() {
  var set = {};
  (AQ.data.frames || []).forEach(function (o) { if (o.frame) set[o.frame] = 1; });
  (AQ.data.comps || []).forEach(function (c) { if (c.frame) set[c.frame] = 1; });
  ['PFK20', 'PFK25', 'PFK30', 'SFK15', 'SFK18'].forEach(function (f) { set[f] = 1; });
  return Object.keys(set).sort();
}

// ── 構成別の見積（その場で編集）──
function aqRenderComp(el, d) {
  var used = {};
  d.plans.forEach(function (p) { p.quotes.forEach(function (q) { if (q.fit !== false) (used[q.quoteNo] = used[q.quoteNo] || []).push(p.machine); }); });
  var rows = d.comps.filter(function (c) {
    if (AQ.frame && (AQ.frame === '__none' ? c.frame : c.frame !== AQ.frame)) return false;
    return _aqHit([c.type, c.boards.join(' '), c.variant, c.gen || '', c.frame || '', c.channel || ''].concat(c.quotes.map(function (q) { return q.quoteNo + ' ' + q.subject; })).join(' '));
  });
  var ed = function (ci, f, v, ph, w, on) {
    return '<input type="' + (f === 'date' ? 'date' : 'text') + '" value="' + _esc(v === null || v === undefined ? '' : v) + '" placeholder="' + _esc(ph || '') + '" onchange="aqEdit(' + ci + ',\'' + f + '\',this)" '
      + (f === 'frame' ? 'list="aq-frames" ' : '') + (f === 'boards' ? 'title="複数は / で区切る（例: DE1802A / D2101A / E2503B）" ' : '')
      + 'style="width:' + w + ';padding:3px 5px;border:1px solid ' + (on ? '#f59e0b' : '#e2e8f0') + ';border-radius:4px;font-size:12px;background:' + (on ? '#fffbeb' : '#fff') + ';' + (f === 'boards' ? 'font-weight:700;' : '') + (f === 'amount' ? 'text-align:right;font-weight:700;' : '') + '">';
  };
  var sel = function (ci, f, v, list, on) {
    var opts = list.slice(); if (v && opts.indexOf(v) < 0) opts.push(v);
    return '<select onchange="aqEdit(' + ci + ',\'' + f + '\',this)" style="padding:3px;font-size:12px;max-width:140px;border:1px solid ' + (on ? '#f59e0b' : '#e2e8f0') + ';border-radius:4px;background:' + (on ? '#fffbeb' : '#fff') + ';">'
      + (f === 'gen' ? '<option value="">—</option>' : '') + opts.map(function (o) { return '<option value="' + _esc(o) + '"' + (o === v ? ' selected' : '') + '>' + _esc(o) + '</option>'; }).join('')
      + (on ? '<option value="">（自動判定に戻す）</option>' : '') + '</select>';
  };
  var types = d.cfg.types.map(function (t) { return t.name; }).concat(['その他']), vars = d.cfg.variants.map(function (t) { return t.name; }), gens = d.cfg.gens.map(function (t) { return t.name; });
  var h2 = function (t, ex) { return _aqTh(t, ex || ''); };
  var last = null, cols = 24;
  el.innerHTML = _adFrameBar(d) + '<datalist id="aq-frames">' + _adFrameList().map(function (f) { return '<option value="' + _esc(f) + '">'; }).join('') + '</datalist>'
    + '<div class="bpt-wrap" style="overflow:auto;max-height:72vh;"><table style="border-collapse:collapse;font-size:12px;width:100%;"><thead><tr>'
    + ['種類', '枠構成', '使用基板（編集可）', '区分', '世代', '商流', '最新見積No', '提出日', '金額'].map(function (t) { return h2(t, '').replace('<th ', '<th rowspan="2" '); }).join('')
    + '<th colspan="12" style="border:1px solid #94a3b8;padding:4px 8px;background:#dbeafe;text-align:center;">見積内訳（組立費見積書の項目）</th>'
    + ['PDF', '件名', '件数 / 採用予定'].map(function (t) { return h2(t, '').replace('<th ', '<th rowspan="2" '); }).join('') + '</tr><tr>'
    + d.subSections.concat(['小計', '管理費', '利益', 'レーザー<br>マーキング', '値引き', '内訳合計']).map(function (t) { return h2(t, 'background:#eff6ff;'); }).join('') + '</tr></thead><tbody>'
    + rows.map(function (c) {
        var ci = d.comps.indexOf(c), l = c.latest || {}, e = c.edited || {}, x = c.detail && c.detail.calc;
        var sk = c.type + '　' + (c.frame ? '枠構成 ' + c.frame : '枠構成 未設定');
        var sec = sk !== last ? '<tr><td colspan="' + cols + '" style="background:#f1f5f9;font-weight:700;border:1px solid #cbd5e1;padding:4px 8px;">' + _esc(sk) + '</td></tr>' : '';
        last = sk;
        var num = function (n) { return _aqTd('<span onclick="aqDetail(' + ci + ')" style="cursor:pointer;">' + (x ? _adFmt(n) : '<span style="color:#cbd5e1;">—</span>') + '</span>', 'text-align:right;white-space:nowrap;'); };
        var diff = x && l.amount && Math.abs(x.total - l.amount) > 0.005;
        var hist = c.quotes.slice(1).map(function (q) { return _esc(q.quoteNo) + ' ' + _aqYen(q.amount) + ' ' + _esc(q.date) + (q.archived ? '（' + _esc(q.status) + '）' : ''); }).join('<br>');
        return sec + '<tr>' + _aqTd(sel(ci, 'type', c.type, types, e.type))
          + _aqTd(ed(ci, 'frame', c.frame, (c.frameCands || []).length > 1 ? '候補: ' + c.frameCands.join('・') : '例: PFK30', '86px', e.frame) + (c.frameGuess ? '<div style="font-size:10px;color:#c2410c;">推定</div>' : ''))
          + _aqTd(ed(ci, 'boards', c.boards.join(' / '), '基板名を入力', '220px', e.boards))
          + _aqTd(sel(ci, 'variant', c.variant, vars, e.variant), c.kind === '中古再生' ? 'background:#fef3c7;' : '')
          + _aqTd(sel(ci, 'gen', c.gen, gens, e.gen))
          + _aqTd(_esc(c.channel || ''), 'white-space:nowrap;' + (c.needQuote === '不要' ? 'color:#64748b;' : ''))
          + _aqTd('<b>' + _esc(l.quoteNo || '') + '</b>', 'white-space:nowrap;') + _aqTd(ed(ci, 'date', String(l.date || '').replace(/\//g, '-'), '', '120px', e.date))
          + _aqTd(ed(ci, 'amount', l.amount ? Number(l.amount).toLocaleString('ja-JP', { maximumFractionDigits: 2 }) : '', '—', '84px', e.amount), 'background:#fef9c3;')
          + d.subSections.map(function (k) { return num(x ? x.sums[k] : ''); }).join('') + num(x ? x.sub : '') + num(x ? x.sums['管理費'] : '') + num(x ? x.profit : '') + num(x ? x.sums['レーザーマーキング'] : '') + num(x ? x.sums['値引き'] : '')
          + _aqTd((x ? '<b style="' + (diff ? 'color:#dc2626;' : '') + '"' + (diff ? ' title="見積金額と一致しません"' : '') + '>' + _adFmt(x.total) + (diff ? ' ⚠' : '') + '</b> ' : '') + '<button class="btn btn-outline btn-sm" style="padding:1px 6px;" onclick="aqDetail(' + ci + ')">' + (x ? '✏️' : '＋内訳') + '</button>', 'white-space:nowrap;text-align:right;')
          + _aqTd(_aqPdf(l.pdfUrl)) + _aqTd(ed(ci, 'subject', l.subject || '', '', '240px', e.subject))
          + _aqTd(c.count + '件' + (hist ? '<details><summary style="cursor:pointer;font-size:11px;">過去</summary><div style="font-size:11px;white-space:nowrap;">' + hist + '</div></details>' : '') + (used[l.quoteNo] ? '<div style="font-size:11px;color:#475569;">' + _esc(used[l.quoteNo].join('、')) + '</div>' : '')) + '</tr>';
      }).join('') + '</tbody></table></div><div style="font-size:11px;color:#64748b;margin-top:4px;">枠がオレンジの欄は手で直した値です。種類・基板・区分・枠構成の変更は、↻ 再集計 で並びとまとまりに反映されます。</div>';
}
function _adFrameBar(d) {
  var cnt = {}, none = 0;
  d.comps.forEach(function (c) { if (c.frame) cnt[c.frame] = (cnt[c.frame] || 0) + 1; else none++; });
  var b = function (k, t) { return '<button class="btn btn-sm ' + (AQ.frame === k ? 'btn-primary' : 'btn-outline') + '" style="padding:2px 9px;" onclick="AQ.frame=\'' + k + '\';aqRenderBody()">' + t + '</button>'; };
  return '<div style="display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-bottom:6px;"><span style="font-size:12px;">枠構成：</span>' + b('', 'すべて ' + d.comps.length)
    + Object.keys(cnt).sort().map(function (k) { return b(_esc(k), _esc(k) + ' ' + cnt[k]); }).join('') + b('__none', '未設定 ' + none) + '</div>';
}
function aqEdit(ci, f, inp) {
  var c = AQ.data.comps[ci]; if (!c) return;
  // 提出日・金額・件名は最新の見積だけ、それ以外は同じ構成の見積すべてに反映
  var keys = ['date', 'amount', 'subject'].indexOf(f) >= 0 ? [c.latest.key] : c.quotes.map(function (q) { return q.key; });
  var v = inp.value, old = inp.style.borderColor;
  inp.style.borderColor = '#2563eb';
  _adApi('asmOverrideSave', { keys: keys, field: f, value: v }, function (r) {
    inp.style.borderColor = '#f59e0b'; inp.style.background = '#fffbeb';
    c.edited = c.edited || {};
    if (r.value === '') { delete c.edited[f]; showToast('自動判定に戻しました。↻ 再集計 で反映されます'); return; }
    c.edited[f] = true;
    if (f === 'boards') { c.boards = r.value.split(' / '); inp.value = r.value; }
    else if (f === 'amount') { c.latest.amount = Number(r.value); aqRenderBody(); }
    else if (f === 'date' || f === 'subject') c.latest[f] = r.value;
    else { c[f] = r.value; if (f === 'frame') c.frameGuess = false; }
    showToast('保存しました');
  }, function () { inp.style.borderColor = old; });
}

// ── 見積内訳（組立費見積書「見積詳細」と同じ項目）──
var AQD = null;
function _aqdTemplate(c) {
  var suf = c.variant === '全新品' ? '_新品' : '', b = c.boards, L = [];
  b.forEach(function (x) { L.push({ sec: '材料費', name: 'FJ+' + x + suf, price: 0, note: '別途仕掛基板見積り' }); });
  if (c.type.indexOf('液晶') >= 0) L.push({ sec: '材料費', name: '電池（BR2032）', price: '', note: '' });
  b.forEach(function (x) { L.push({ sec: 'Assy費', name: 'FJ+' + x + suf, price: 0, note: '別途仕掛基板見積り' }); });
  [['組立', '組立費'], ['検査', '検査費'], ['梱包', '梱包費'], ['輸送費', '輸送費']].forEach(function (x) { L.push({ sec: x[0], name: x[1], price: '', note: '' }); });
  b.forEach(function (x) { L.push({ sec: '管理費', name: 'FJ+' + x + suf, price: '', note: '' }); });
  L.push({ sec: 'レーザーマーキング', name: 'レーザーマーキング無し', price: 0, note: '' }, { sec: '値引き', name: '値引き', price: 0, note: '' });
  return L;
}
function aqDetail(ci) {
  var c = AQ.data.comps[ci]; if (!c) return;
  var d = c.detail;
  AQD = { ci: ci, lines: JSON.parse(JSON.stringify(d ? d.lines : _aqdTemplate(c))), rate: d ? d.rate : 12, profit: d ? d.profit : null };
  var ov = document.getElementById('aqd-modal'); if (ov) ov.remove();
  ov = document.createElement('div'); ov.id = 'aqd-modal';
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;';
  ov.innerHTML = '<div id="aqd-box" style="background:#fff;border-radius:10px;max-width:860px;width:100%;max-height:92vh;overflow:auto;padding:16px;"></div>';
  document.body.appendChild(ov);
  aqdRender();
}
function aqdCalc() {
  var s = {}; AQ.data.sections.forEach(function (k) { s[k] = 0; });
  AQD.lines.forEach(function (l) { s[l.sec] = Math.round((s[l.sec] + (_adParse(l.price) || 0)) * 100) / 100; });
  var sub = AQ.data.subSections.reduce(function (a, k) { return a + s[k]; }, 0), r = _adParse(AQD.rate), m = _adParse(AQD.profit);
  sub = Math.round(sub * 100) / 100;
  var profit = m !== null ? m : r === null ? 0 : Math.round(sub * r + 1e-7) / 100;
  return { sums: s, sub: sub, profit: profit, total: Math.round((sub + s['管理費'] + profit + s['レーザーマーキング'] + s['値引き']) * 100) / 100 };
}
function aqdRender() {
  var box = document.getElementById('aqd-box'); if (!box) return;
  var c = AQ.data.comps[AQD.ci], l = c.latest, others = AQ.data.comps.map(function (x, i) { return { x: x, i: i }; }).filter(function (o) { return o.x.detail && o.i !== AQD.ci; });
  others.sort(function (a, b) { return (b.x.boardKey === c.boardKey) - (a.x.boardKey === c.boardKey); });
  var td = 'border:1px solid #64748b;padding:4px 6px;';
  var head = function (t, id, add) { return '<tr style="background:#cbd5e1;font-weight:700;"><td style="' + td + '" colspan="2">' + t + (add ? ' <button class="btn btn-outline btn-sm" style="padding:0 7px;background:#fff;" onclick="aqdAdd(\'' + add + '\')">＋行</button>' : '') + '</td><td id="' + id + '" style="' + td + 'text-align:right;"></td><td style="' + td + '" colspan="2"></td></tr>'; };
  var lines = function (sec) {
    return AQD.lines.map(function (x, i) {
      if (x.sec !== sec) return '';
      var inp = function (f, st) { return '<input value="' + _esc(x[f] === null || x[f] === undefined ? '' : x[f]) + '" oninput="AQD.lines[' + i + '].' + f + '=this.value;aqdSum()" style="width:100%;border:1px solid #e2e8f0;border-radius:4px;padding:3px 5px;box-sizing:border-box;' + st + '">'; };
      return '<tr><td style="' + td + 'background:#cbd5e1;width:18px;"></td><td style="' + td + '">' + inp('name', '') + '</td><td style="' + td + 'width:120px;">' + inp('price', 'text-align:right;' + (sec === '値引き' ? 'color:#dc2626;' : '')) + '</td><td style="' + td + '">' + inp('note', '') + '</td><td style="' + td + 'width:30px;"><button class="btn btn-outline btn-sm" style="padding:0 6px;" onclick="AQD.lines.splice(' + i + ',1);aqdRender()">✕</button></td></tr>';
    }).join('');
  };
  box.innerHTML = '<div style="display:flex;justify-content:space-between;gap:8px;align-items:center;"><h3 style="margin:0;">見積内訳　' + _esc(l.quoteNo || '') + '</h3><button class="btn btn-outline btn-sm" onclick="document.getElementById(\'aqd-modal\').remove()">閉じる</button></div>'
    + '<div style="font-size:12px;color:#475569;margin:4px 0 8px;">' + _esc(c.type) + '　' + _esc(c.boards.join(' / ')) + '　<b>' + _esc(c.variant) + '</b>' + (c.frame ? '　枠構成 ' + _esc(c.frame) : '') + '　' + _aqPdf(l.pdfUrl) + '</div>'
    + (others.length ? '<div style="font-size:12px;margin-bottom:8px;">ほかの構成から写す：<select onchange="aqdCopy(this.value)" style="max-width:520px;"><option value="">選択…</option>' + others.map(function (o) { return '<option value="' + o.i + '">' + _esc([o.x.variant, o.x.frame, o.x.boards.join('/'), o.x.latest.quoteNo].filter(String).join('　')) + '</option>'; }).join('') + '</select></div>' : '')
    + '<table style="border-collapse:collapse;width:100%;font-size:12px;"><tr style="background:#94a3b8;font-weight:700;"><td style="' + td + '" colspan="2">項目</td><td style="' + td + '">単価</td><td style="' + td + '" colspan="2">備考</td></tr>'
    + AQ.data.subSections.map(function (k, i) { return head(k, 'aqd-s' + i, k) + lines(k); }).join('')
    + head('制御基板（完） 小計', 'aqd-sub', '') + head('管理費', 'aqd-mg', '管理費') + lines('管理費')
    + '<tr style="background:#cbd5e1;font-weight:700;"><td style="' + td + '" colspan="2">利益　割合 <input value="' + _esc(AQD.rate === null || AQD.rate === undefined ? '' : AQD.rate) + '" oninput="AQD.rate=this.value;aqdSum()" style="width:56px;text-align:right;">%</td><td style="' + td + '"><input id="aqd-pf" value="' + _esc(AQD.profit === null || AQD.profit === undefined ? '' : AQD.profit) + '" oninput="AQD.profit=this.value;aqdSum()" style="width:100%;text-align:right;box-sizing:border-box;"></td><td style="' + td + 'font-weight:400;" colspan="2">空欄なら 小計 × 割合</td></tr>'
    + head('レーザーマーキング', 'aqd-lz', 'レーザーマーキング') + lines('レーザーマーキング') + head('値引き（マイナスで入力）', 'aqd-dc', '値引き') + lines('値引き')
    + '<tr style="background:#fef08a;font-weight:700;font-size:14px;"><td style="' + td + '" colspan="2">合計</td><td id="aqd-total" style="' + td + 'text-align:right;"></td><td id="aqd-chk" style="' + td + 'font-size:12px;" colspan="2"></td></tr></table>'
    + '<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px;">' + (c.detail ? '<button class="btn btn-outline" onclick="aqdSave(true)">内訳を消す</button>' : '') + '<button class="btn btn-primary" id="aqd-save" onclick="aqdSave(false)">💾 保存</button></div>';
  aqdSum();
}
function aqdSum() {
  var r = aqdCalc(), set = function (id, n) { var e = document.getElementById(id); if (e) e.textContent = isNaN(n) ? '数値エラー' : _adFmt(n); };
  AQ.data.subSections.forEach(function (k, i) { set('aqd-s' + i, r.sums[k]); });
  set('aqd-sub', r.sub); set('aqd-mg', r.sums['管理費']); set('aqd-lz', r.sums['レーザーマーキング']); set('aqd-dc', r.sums['値引き']); set('aqd-total', r.total);
  var pf = document.getElementById('aqd-pf'); if (pf) pf.placeholder = _adFmt(r.profit);
  var a = AQ.data.comps[AQD.ci].latest.amount, ck = document.getElementById('aqd-chk');
  if (ck) ck.innerHTML = !a ? '見積金額が未登録です' : Math.abs(a - r.total) < 0.005 ? '<span style="color:#166534;">✓ 見積金額と一致</span>' : '<span style="color:#dc2626;">見積金額 ' + _adFmt(a) + ' と差 ' + _adFmt(r.total - a) + '</span>';
}
function aqdAdd(sec) { AQD.lines.push({ sec: sec, name: '', price: '', note: '' }); aqdRender(); }
function aqdCopy(i) { var x = AQ.data.comps[i]; if (!x || !x.detail) return; AQD.lines = JSON.parse(JSON.stringify(x.detail.lines)); AQD.rate = x.detail.rate; AQD.profit = x.detail.profit; aqdRender(); }
function aqdSave(remove) {
  if (remove && !confirm('この見積の内訳を消します。よろしいですか？')) return;
  var c = AQ.data.comps[AQD.ci], r = aqdCalc();
  if (!remove && isNaN(r.total)) { showToast('数値で入力してください', true); return; }
  var b = document.getElementById('aqd-save'); b.disabled = true;
  _adApi('asmDetailSave', { key: c.latest.key, quoteNo: c.latest.quoteNo, lines: AQD.lines, rate: AQD.rate, profit: AQD.profit, remove: remove }, function (res) {
    c.detail = res.detail; var m = document.getElementById('aqd-modal'); if (m) m.remove();
    showToast(remove ? '内訳を消しました' : '内訳を保存しました'); aqRenderBody();
  }, function () { b.disabled = false; });
}

// ── 区分別の価格（全新品／D基板中古／オール中古）──
function aqRenderPrice(el, d) {
  var main = d.mainVariants, g = {}, order = [];
  d.comps.forEach(function (c, i) {
    if (!c.boards.length || (AQ.frame && (AQ.frame === '__none' ? c.frame : c.frame !== AQ.frame))) return;
    if (!_aqHit([c.type, c.frame || '', c.boards.join(' '), c.variant, c.latest.quoteNo].join(' '))) return;
    var k = [c.type, c.frame || '', c.boardKey, c.gen || ''].join('|');
    if (!g[k]) { g[k] = { c: c, v: {}, o: [] }; order.push(k); }
    if (main.indexOf(c.variant) >= 0) g[k].v[c.variant] = { c: c, i: i }; else g[k].o.push({ c: c, i: i });
  });
  var cell = function (x, base) {
